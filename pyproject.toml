[project]
name = "engineering-issue-desk"
version = "0.1.0"
description = "Evidence-backed issue triage over a versioned Streamlit knowledge corpus."
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.48,<2",
  "fastembed>=0.7,<1",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "langgraph>=1,<2",
  "langchain-core>=1,<2",
  "networkx>=3,<4",
  "flashrank>=0.2,<1",
  "deepagents>=0.7,<0.8",
  "langchain-fireworks>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "bandit>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
