[project]
name = "week5-ticket-router"
version = "0.1.0"
description = "Reproducible Qwen3 LoRA support-ticket routing experiment."
requires-python = ">=3.11,<3.14"
dependencies = [
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router_lab"]

[project.optional-dependencies]
inference = [
  "torch>=2.4,<3",
  "transformers>=4.55,<5,!=4.57.0",
  "peft>=0.18,<=0.18.1",
  "accelerate>=1.3,<=1.11",
  "safetensors>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

